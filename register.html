<section>
<h1>GYM REGISTRATION</h1>
<p>Fill in your details to join FitZone.</p>
<form action="#" method="get">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your name" required>

<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit phone number" required>

<label for="program">Workout Program</label>
<select id="program" name="program" required>
<option value="">Choose a program</option>
<option>Strength Training</option>
<option>Cardio Training</option>
<option>Personal Training</option>
<option>Yoga</option>
<option>Group Fitness</option>
</select>

<label for="plan">Membership Plan</label>
<select id="plan" name="plan" required>
<option value="">Choose a plan</option>
<option>Basic - ₹999/month</option>
<option>Standard - ₹1,799/month</option>
<option>Premium - ₹2,999/month</option>
</select>

<label for="date">Start Date</label>
<input type="date" id="date" name="date" required>

<label for="goal">Fitness Goal</label>
<textarea id="goal" name="goal" placeholder="Enter your fitness goal"></textarea>

<button type="submit" class="btn">Submit Registration</button>
<button type="reset" class="btn">Clear Form</button>
</form>
</section>
<footer><a href="index.html">Back to Home</a></footer>
</body>
